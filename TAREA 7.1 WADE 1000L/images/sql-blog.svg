  <g fill="#89d9ff" font-family="Consolas, monospace" font-size="28"><text x="255" y="290">SELECT region, SUM(sales)</text><text x="255" y="340">FROM sales_data</text><text x="255" y="390">WHERE year = 2026</text><text x="255" y="440">GROUP BY region</text><text x="255" y="490">ORDER BY SUM(sales) DESC;</text></g>
